name: BallAssist
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
targets:
  BallAssist:
    type: application
    platform: iOS
    sources:
      - path: BallAssist
    info:
      path: BallAssist/Info.plist
    entitlements:
      path: BallAssist/BallAssist.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.BallAssist
        PRODUCT_NAME: 球球AI助手
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
    dependencies:
      - target: BallAssistBroadcast
        embed: true

  BallAssistBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: BallAssistBroadcast
    info:
      path: BallAssistBroadcast/Info.plist
    entitlements:
      path: BallAssistBroadcast/BallAssistBroadcast.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.BallAssist.Broadcast
        PRODUCT_NAME: BallAssistBroadcast
        SWIFT_VERSION: 5.0
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
