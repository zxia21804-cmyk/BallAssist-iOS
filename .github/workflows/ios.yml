
name: Build iPhone App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iPhone device app
        run: |
          set -o pipefail
          xcodebuild \
            -project BallAssist.xcodeproj \
            -scheme BallAssist \
            -sdk iphoneos \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log

      - name: Package unsigned app
        run: |
          mkdir -p Payload
          cp -R build/DerivedData/Build/Products/Debug-iphoneos/*.app Payload/
          cd Payload
          zip -r ../BallAssist-unsigned.ipa .

      - name: Upload iPhone build
        uses: actions/upload-artifact@v4
        with:
          name: BallAssist-iPhone-unsigned
          path: |
            BallAssist-unsigned.ipa
            build.log
